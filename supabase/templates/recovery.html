<h2>Restablece tu contraseña</h2>
<p>Pulsa el enlace para elegir una nueva contraseña:</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password">Restablecer contraseña</a></p>
<p>Si usas la app móvil, introduce este código: <strong>{{ .Token }}</strong></p>
<p>Si no lo has solicitado, ignora este mensaje.</p>
